<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palle luminose VR</title>
<style>
html,body{margin:0;height:100%;background:#05060f;color:#e8ecff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;left:16px;bottom:16px;width:min(340px,calc(100% - 64px));padding:16px;border-radius:16px;background:rgba(12,14,30,.85);border:1px solid #2b3366}
h1{font-size:17px;margin:0 0 6px}
p{font-size:12.5px;line-height:1.5;margin:6px 0;color:#aab3e8}
button{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#3da5ff,#b06bff);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
label{display:block;font-size:12.5px;margin-top:10px;color:#dfe6ff}
input[type=range]{width:100%}
#msg{color:#ff8fa8}
</style>
</head>
<body>
<div id="ui">
  <h1>Palle luminose VR</h1>
  <button id="go">Entra in VR / passthrough</button>
  <label for="vr">Quanto VR (0 = stanza reale, 100 = tutto virtuale)</label>
  <input id="vr" type="range" min="0" max="100" value="40">
  <p>Guarda la mano sinistra e fai doppio pizzico pollice-medio per aprire o chiudere la palette. Pizzica pollice-indice per afferrare e spostare sfere e oggetti. Un colpo veloce con l'indice fa rimbalzare le sfere. Tocca i pulsanti con l'indice destro.</p>
  <p id="msg"></p>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);

/* ---------- base ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.02,100);
scene.add(new THREE.HemisphereLight(0xbfd2ff,0x202040,.9));
const lights=[0,1,2,3].map(()=>{const l=new THREE.PointLight(0xffffff,0,3,2);scene.add(l);return l});

let vr=.4,glow=1,isAR=false,mode='move',colorIdx=4,open=false,ps=0,snap=false,dirty=true,hover=null,latch=false;
const COL=['#ff3d71','#ff9f1c','#ffe66d','#2ee6a6','#3da5ff','#b06bff'];
const NOTES=[261.6,293.7,329.6,392,440,523.3,587.3];

/* ---------- audio ---------- */
let ac=null;
function ping(f,v=.07){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.6);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.65);
}

/* ---------- cielo virtuale (sfumato dallo slider) e pavimento ---------- */
const skyMat=new THREE.ShaderMaterial({
  uniforms:{uA:{value:1}},side:THREE.BackSide,transparent:true,depthWrite:false,
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform float uA;varying vec3 vP;void main(){vec3 d=normalize(vP);vec3 c=mix(vec3(.01,.01,.05),vec3(.08,.02,.15),d.y*.5+.5);vec3 g=floor(d*150.);float h=fract(sin(dot(g,vec3(12.9898,78.233,45.164)))*43758.5453);c+=step(.997,h)*vec3(.9,.95,1.);gl_FragColor=vec4(c,uA);}'
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(40,32,16),skyMat);
sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);
const grid=new THREE.GridHelper(12,48,0x3da5ff,0x23306b);
grid.material.transparent=true;scene.add(grid);

/* ---------- oggetti ---------- */
const gc=document.createElement('canvas');gc.width=gc.height=128;
{const x=gc.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');
 x.fillStyle=g;x.fillRect(0,0,128,128);}
const glowTex=new THREE.CanvasTexture(gc);
const items=[];
const sphG=new THREE.SphereGeometry(.06,24,16);

function addOrb(pos,hex){
  const c=new THREE.Color(hex);
  const g=new THREE.Group();
  const core=new THREE.Mesh(sphG,new THREE.MeshBasicMaterial({color:c.clone().lerp(new THREE.Color(1,1,1),.5),toneMapped:false}));
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,toneMapped:false}));
  g.add(core,sp);g.position.copy(pos);
  g.userData={kind:'orb',r:.07,v:new THREE.Vector3(),ph:Math.random()*6.28,sp,c,cool:0,note:Math.floor(Math.random()*7),held:false};
  scene.add(g);items.push(g);return g;
}
function addSolid(kind,pos,hex){
  const geo={
    cube:()=>new THREE.BoxGeometry(.22,.22,.22),
    column:()=>new THREE.CylinderGeometry(.07,.07,.8,24),
    pyramid:()=>new THREE.ConeGeometry(.17,.32,4),
    torus:()=>new THREE.TorusGeometry(.13,.045,16,40)
  }[kind]();
  const c=new THREE.Color(hex);
  const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:c,roughness:.45,metalness:.1,emissive:c,emissiveIntensity:.12}));
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.5})));
  geo.computeBoundingSphere();
  m.position.copy(pos);m.userData={kind,r:geo.boundingSphere.radius,held:false};
  scene.add(m);items.push(m);return m;
}
function populate(){
  items.splice(0).forEach(o=>scene.remove(o));
  const P=(x,y,z)=>new THREE.Vector3(x,y,z);
  COL.forEach((h,i)=>{const a=i/COL.length*Math.PI*1.2-.6;addOrb(P(Math.sin(a)*1.1,1.1+.25*Math.sin(i*2),-Math.cos(a)*1.1-.2),h)});
  addSolid('column',P(-1.2,.4,-1.4),'#3da5ff');
  addSolid('cube',P(0,.11,-1.5),'#ff9f1c');
  addSolid('pyramid',P(1.2,.16,-1.3),'#b06bff');
}
populate();

/* ---------- palette sulla mano sinistra ---------- */
const PW=.26,PH=.325;
const pcv=document.createElement('canvas');pcv.width=512;pcv.height=640;
const px=pcv.getContext('2d');
const ptex=new THREE.CanvasTexture(pcv);ptex.colorSpace=THREE.SRGBColorSpace;
const panel=new THREE.Mesh(new THREE.PlaneGeometry(PW,PH),new THREE.MeshBasicMaterial({map:ptex,transparent:true,toneMapped:false}));
panel.visible=false;scene.add(panel);

const EL=[
  {id:'vr',t:'s',x:40,y:110,w:432,h:34,l:'Passthrough ⇄ VR'},
  {id:'gl',t:'s',x:40,y:200,w:432,h:34,l:'Luminosità sfere'},
  {id:'sphere',t:'b',x:30,y:292,w:140,h:72,l:'Sfera'},
  {id:'cube',t:'b',x:186,y:292,w:140,h:72,l:'Cubo'},
  {id:'column',t:'b',x:342,y:292,w:140,h:72,l:'Colonna'},
  {id:'pyramid',t:'b',x:30,y:376,w:140,h:72,l:'Piramide'},
  {id:'torus',t:'b',x:186,y:376,w:140,h:72,l:'Toro'},
  {id:'reset',t:'b',x:342,y:376,w:140,h:72,l:'Reset'},
  ...COL.map((c,i)=>({id:'c'+i,t:'c',i,x:40+i*72,y:472,w:60,h:48})),
  {id:'move',t:'m',x:30,y:548,w:220,h:64,l:'Sposta'},
  {id:'del',t:'m',x:262,y:548,w:220,h:64,l:'Cancella'}
];
function drawPanel(){
  const x=px;x.clearRect(0,0,512,640);
  x.beginPath();x.roundRect(6,6,500,628,38);x.fillStyle='rgba(10,12,30,.92)';x.fill();
  x.lineWidth=5;x.strokeStyle='#4f5fe0';x.stroke();
  x.textAlign='center';x.fillStyle='#fff';x.font='700 34px system-ui,sans-serif';x.fillText('Palette',256,66);
  x.font='600 22px system-ui,sans-serif';x.textAlign='left';x.fillStyle='#9fb0ff';
  x.fillText('Aggiungi',40,278);x.fillText('Colore',40,458);
  for(const e of EL){
    const hv=e===hover;
    if(e.t==='s'){
      const v=e.id==='vr'?vr:glow/2;
      x.fillStyle='#9fb0ff';x.font='600 22px system-ui,sans-serif';
      x.textAlign='left';x.fillText(e.l,e.x,e.y-14);
      x.textAlign='right';x.fillText(Math.round(v*100)+'%',e.x+e.w,e.y-14);
      x.fillStyle='#1b2150';x.beginPath();x.roundRect(e.x,e.y+8,e.w,18,9);x.fill();
      const g=x.createLinearGradient(e.x,0,e.x+e.w,0);g.addColorStop(0,'#3da5ff');g.addColorStop(1,'#b06bff');
      x.fillStyle=g;x.beginPath();x.roundRect(e.x,e.y+8,Math.max(18,e.w*v),18,9);x.fill();
      x.fillStyle=hv?'#fff':'#dfe6ff';x.beginPath();x.arc(e.x+e.w*v,e.y+17,hv?20:16,0,7);x.fill();
    }else if(e.t==='c'){
      x.fillStyle=COL[e.i];x.beginPath();x.roundRect(e.x,e.y,e.w,e.h,14);x.fill();
      if(e.i===colorIdx||hv){x.lineWidth=5;x.strokeStyle='#fff';x.stroke();}
    }else{
      const on=(e.id==='move'&&mode==='move')||(e.id==='del'&&mode==='del');
      x.fillStyle=on?(e.id==='del'?'#e0365f':'#3da5ff'):(hv?'#2c3a8c':'#1d2552');
      x.beginPath();x.roundRect(e.x,e.y,e.w,e.h,18);x.fill();
      x.fillStyle='#fff';x.font='700 26px system-ui,sans-serif';x.textAlign='center';
      x.fillText(e.l,e.x+e.w/2,e.y+e.h/2+9);
    }
  }
  ptex.needsUpdate=true;
}
function setSlider(e,f){
  f=Math.min(1,Math.max(0,f));
  if(e.id==='vr'){vr=f;$('vr').value=Math.round(f*100)}else glow=f*2;
}
function spawnPos(cp){
  return panel.position.clone().add(new THREE.Vector3(0,.28,0)).lerp(cp,.12);
}
function act(e,cp){
  ping(660,.05);
  if(e.t==='c'){colorIdx=e.i}
  else if(e.id==='move'||e.id==='del'){mode=e.id}
  else if(e.id==='reset'){populate()}
  else if(e.id==='sphere'){addOrb(spawnPos(cp),COL[colorIdx])}
  else addSolid(e.id,spawnPos(cp),COL[colorIdx]);
  dirty=true;
}
function pokeUpdate(tip,cp){
  let h=null,t=false,cx=0;
  if(tip&&open&&ps>.9){
    const p=panel.worldToLocal(tip.clone());
    cx=(p.x/PW+.5)*512;const cy=(.5-p.y/PH)*640;
    if(p.z<.07&&p.z>-.04){
      h=EL.find(e=>cx>=e.x-6&&cx<=e.x+e.w+6&&cy>=e.y-(e.t==='s'?14:6)&&cy<=e.y+e.h+(e.t==='s'?14:6))||null;
      t=p.z<.015;
    }
  }
  if(h!==hover){hover=h;dirty=true}
  if(h&&t){
    if(h.t==='s'){setSlider(h,(cx-h.x)/h.w);dirty=true}
    else if(!latch)act(h,cp);
  }
  latch=!!(h&&t);
}
$('vr').oninput=e=>{vr=e.target.value/100;dirty=true};

/* ---------- mani ---------- */
const hands=[0,1].map(i=>{
  const h=renderer.xr.getHand(i);h.userData={};
  h.addEventListener('connected',e=>{h.userData.hd=e.data.handedness});
  h.addEventListener('disconnected',()=>{h.userData.hd=null});
  scene.add(h);return h;
});
const J=(h,n)=>{const j=h.joints&&h.joints[n];return j&&j.visible!==false?j.getWorldPosition(new THREE.Vector3()):null};

function grab(s,mid){
  let best=null,bd=.12;
  for(const o of items){const d=mid.distanceTo(o.position)-o.userData.r*.6;if(d<bd){bd=d;best=o}}
  if(!best)return;
  if(mode==='del'){scene.remove(best);items.splice(items.indexOf(best),1);ping(180,.14);return}
  s.held=best;s.off=best.position.clone().sub(mid);s.last=best.position.clone();s.hv=new THREE.Vector3();
  best.userData.held=true;if(best.userData.v)best.userData.v.set(0,0,0);
  ping(440,.04);
}
function release(s){
  const o=s.held;if(!o)return;
  o.userData.held=false;
  if(o.userData.v)o.userData.v.copy(s.hv).clampLength(0,3);
  s.held=null;
}
function toggle(){
  open=!open;snap=open;dirty=true;ping(open?523:392,.06);
}

/* ---------- ciclo ---------- */
const clock=new THREE.Clock(),camPos=new THREE.Vector3(),camDir=new THREE.Vector3(),dummy=new THREE.Object3D();
let lastWrist=null;

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05)||.014,t=clock.elapsedTime;
  const pres=renderer.xr.isPresenting;
  const k=pres&&isAR?vr:1;
  skyMat.uniforms.uA.value=k;
  grid.material.opacity=k*.55;
  if(!pres){camera.position.set(Math.sin(t*.1)*2.4,1.5,Math.cos(t*.1)*2.4);camera.lookAt(0,1.1,0)}
  const xc=pres?renderer.xr.getCamera():camera;
  xc.getWorldPosition(camPos);xc.getWorldDirection(camDir);

  const fingers=[];let rightTip=null,leftWrist=null;
  for(const h of hands){
    const s=h.userData,hd=s.hd;if(!hd)continue;
    if(!s.dots&&h.joints['index-finger-tip']){
      ['index-finger-tip','thumb-tip'].forEach(n=>h.joints[n].add(new THREE.Mesh(new THREE.SphereGeometry(.007),new THREE.MeshBasicMaterial({color:0x7fe9ff}))));
      s.dots=1;
    }
    const ti=J(h,'index-finger-tip'),tt=J(h,'thumb-tip'),tm=J(h,'middle-finger-tip'),wr=J(h,'wrist');
    if(!ti||!tt){if(s.held)release(s);s.pinch=false;s.prev=null;continue}
    const vel=s.prev?ti.clone().sub(s.prev).divideScalar(dt):new THREE.Vector3();
    s.prev=ti.clone();
    fingers.push({p:ti,vel,sp:vel.length()});
    if(hd==='right')rightTip=ti;
    if(hd==='left'&&wr)leftWrist=wr;
    const di=ti.distanceTo(tt),mid=ti.clone().add(tt).multiplyScalar(.5);
    if(!s.pinch&&di<.025){s.pinch=true;grab(s,mid)}
    else if(s.pinch&&di>.04){s.pinch=false;release(s)}
    if(s.held){
      s.held.position.copy(mid).add(s.off);
      s.hv.lerp(s.held.position.clone().sub(s.last).divideScalar(dt),.3);
      s.last.copy(s.held.position);
    }
    if(hd==='left'&&tm&&wr){
      const dm=tt.distanceTo(tm);
      if(!s.mp&&dm<.025&&di>.04){
        s.mp=true;const now=performance.now();
        if(now-(s.lastM||0)<500){
          s.lastM=0;
          const v=wr.clone().sub(camPos),d=v.length();
          if(d<.9&&v.normalize().dot(camDir)>.75)toggle();
        }else s.lastM=now;
      }else if(s.mp&&dm>.04)s.mp=false;
    }
  }

  /* palette: segue il polso sinistro, rivolta verso lo sguardo */
  if(leftWrist)lastWrist=leftWrist;
  if(lastWrist&&(open||ps>.01)){
    const toCam=camPos.clone().sub(lastWrist).normalize();
    const target=lastWrist.clone().add(new THREE.Vector3(0,.17,0)).addScaledVector(toCam,.04);
    if(snap){panel.position.copy(target);snap=false}
    else panel.position.lerp(target,1-Math.exp(-14*dt));
    dummy.position.copy(panel.position);dummy.lookAt(camPos);
    panel.quaternion.slerp(dummy.quaternion,1-Math.exp(-10*dt));
  }
  ps+=((open?1:0)-ps)*(1-Math.exp(-12*dt));
  panel.scale.setScalar(Math.max(ps,.001));
  panel.visible=ps>.02;
  panel.updateMatrixWorld(true);
  pokeUpdate(rightTip,camPos);
  if(dirty&&panel.visible){drawPanel();dirty=open&&!!hover}

  /* sfere */
  let li=0;
  for(const o of items){
    if(o.userData.kind!=='orb')continue;
    const u=o.userData;u.cool-=dt;u.ph+=dt;
    if(!u.held){
      u.v.x+=Math.sin(u.ph*.7+u.note)*.05*dt;
      u.v.y+=Math.cos(u.ph*.9+u.note)*.04*dt;
      u.v.z+=Math.sin(u.ph*.5+u.note*2)*.05*dt;
      for(const f of fingers){
        if(f.sp>.5&&u.cool<=0&&o.position.distanceTo(f.p)<.1){
          u.v.copy(f.vel).multiplyScalar(.9).clampLength(0,4);
          ping(NOTES[u.note]);u.cool=.3;
        }
      }
      u.v.multiplyScalar(Math.exp(-.9*dt));
      o.position.addScaledVector(u.v,dt);
      const p=o.position;p.y=Math.min(2.6,Math.max(.15,p.y));
      const r=Math.hypot(p.x,p.z);
      if(r>2.6){p.x*=2.6/r;p.z*=2.6/r;u.v.multiplyScalar(-.3)}
    }
    const pulse=1+.12*Math.sin(t*3+u.ph);
    u.sp.scale.setScalar(.4*pulse*(.5+glow*.5));
    u.sp.material.opacity=Math.min(1,.2+.55*glow);
    if(li<4){const l=lights[li++];l.position.copy(o.position);l.color.copy(u.c);l.intensity=glow*1.6}
  }
  for(;li<4;li++)lights[li].intensity=0;

  renderer.render(scene,camera);
});

/* ---------- sessione ---------- */
renderer.xr.addEventListener('sessionstart',()=>{$('ui').style.display='none'});
renderer.xr.addEventListener('sessionend',()=>{$('ui').style.display='';open=false;ps=0});
$('go').onclick=async()=>{
  if(!navigator.xr){$('msg').textContent='WebXR non disponibile. Apri la pagina in HTTPS dal browser del visore (Meta Quest Browser).';return}
  try{
    ac=ac||new AudioContext();ac.resume();
    isAR=await navigator.xr.isSessionSupported('immersive-ar');
    const mode_=isAR?'immersive-ar':'immersive-vr';
    if(!isAR&&!(await navigator.xr.isSessionSupported('immersive-vr'))){$('msg').textContent='Questo dispositivo non supporta sessioni immersive.';return}
    const s=await navigator.xr.requestSession(mode_,{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking']});
    renderer.xr.setReferenceSpaceType('local-floor');
    await renderer.xr.setSession(s);
    $('msg').textContent='';
  }catch(e){$('msg').textContent='Errore: '+e.message}
};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
