<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Palle luminose VR</title>
<style>
html,body{margin:0;height:100%;background:#05060f;color:#e8ecff;font-family:system-ui,sans-serif;overflow:hidden}
canvas{display:block}
#ui{position:fixed;left:16px;bottom:16px;width:min(340px,calc(100% - 64px));padding:16px;border-radius:16px;background:rgba(12,14,30,.85);border:1px solid #2b3366}
h1{font-size:17px;margin:0 0 6px}
p{font-size:12.5px;line-height:1.5;margin:6px 0;color:#aab3e8}
button{width:100%;padding:12px;border:0;border-radius:10px;background:linear-gradient(135deg,#3da5ff,#b06bff);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
label{display:block;font-size:12.5px;margin-top:10px;color:#dfe6ff}
input[type=range]{width:100%}
#msg{color:#ff8fa8}
#ui{max-height:calc(100% - 64px);overflow-y:auto}
select{width:100%;padding:9px;margin-top:4px;border-radius:8px;background:#1b2150;color:#e8ecff;border:1px solid #2b3366;font-size:14px}
button.sec{background:#1d2552;border:1px solid #2b3366;margin-top:12px;padding:10px;font-size:13.5px}
</style>
</head>
<body>
<div id="ui">
  <h1>Palle luminose VR</h1>
  <button id="go">Entra in VR / passthrough</button>
  <label for="vr">Quanto VR (0 = stanza reale, 100 = tutto virtuale)</label>
  <input id="vr" type="range" min="0" max="100" value="40">
  <label for="n">Punti luce: <span id="nv">6</span></label>
  <input id="n" type="range" min="1" max="24" value="6">
  <label for="fog">Nebbia</label>
  <input id="fog" type="range" min="0" max="100" value="0">
  <label for="pcSel">Preset colori luci</label>
  <select id="pcSel"></select>
  <label for="mvSel">Movimento luci</label>
  <select id="mvSel"></select>
  <button id="floorBtn" class="sec">Nascondi pavimento</button>
  <p>Guarda la mano sinistra e fai doppio pizzico pollice-medio per aprire o chiudere la palette. Pizzica pollice-indice per afferrare e spostare. Un colpo veloce con l'indice lancia le sfere. Tocca i pulsanti con l'indice destro.</p>
  <p id="msg"></p>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const $=id=>document.getElementById(id);

/* ---------- base ---------- */
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
renderer.xr.enabled=true;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x141a3a,0);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.02,100);
scene.add(new THREE.HemisphereLight(0xbfd2ff,0x202040,.3));
const NL=4;
const lights=[...Array(NL)].map(()=>{const l=new THREE.PointLight(0xffffff,0,4,2);scene.add(l);return l});

let vr=.4,glow=1,fog=0,isAR=false,mode='move',colorIdx=4,matIdx=1,tab=0;
let cpIdx=0,mvIdx=0,floorOn=true;
let open=false,ps=0,snap=false,dirty=true,hover=null,latch=false,fc=0;
const COL=['#ff3d71','#ff9f1c','#ffe66d','#2ee6a6','#3da5ff','#b06bff'];
const MATL=['Gesso','Metallo','Vetro','Dicroica','Plastica','Satinato'];
const NOTES=[261.6,293.7,329.6,392,440,523.3,587.3];
const FY={cube:.11,column:.4,sphere:.14};
const PRESETS=[
  {n:'Originale',c:['#ff3d71','#ff9f1c','#ffe66d','#2ee6a6','#3da5ff','#b06bff']},
  {n:'Arcobaleno',c:['#ff3030','#ff9f1c','#ffe14d','#2ee65a','#3da5ff','#b06bff']},
  {n:'Fuoco',c:['#ff1a1a','#ff4d00','#ff8000','#ffb300','#ffd54a','#fff0a8']},
  {n:'Oceano',c:['#0033ff','#0072ff','#00b4ff','#00e5ff','#2effc4','#7aa8ff']},
  {n:'Neon',c:['#ff00e5','#00fff0','#c6ff00','#ff2a6d','#7d5cff','#05ffa1']},
  {n:'Pastello',c:['#ffb3c7','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#cdb4ff']},
  {n:'Tramonto',c:['#ff4e50','#fc913a','#f9d423','#ff6f91','#c34a9b','#6a3fa0']},
  {n:'Foresta',c:['#0b8f3c','#2ee66a','#9be564','#d4e157','#00a896','#7bdcb5']},
  {n:'Ghiaccio',c:['#e0f7ff','#a8e6ff','#6fc7ff','#b9a8ff','#ffffff','#8ad1e8']}
];
const MOVES=['Libero','Orbita','Onda','Spirale','Respiro','Infinito','Caos','Ferme'];
const TG=new THREE.Vector3();
function moveTarget(i,n,t,out){
  const a=i/n*Math.PI*2,R=RI*.6,TP=Math.PI*2;
  let ang,r,u;
  switch(mvIdx){
    case 1:ang=a+t*.45;out.set(cx+Math.cos(ang)*R,1.1+.25*Math.sin(i*2),cz+Math.sin(ang)*R);break;
    case 2:ang=a+t*.1;out.set(cx+Math.cos(ang)*R,1.2+.5*Math.sin(t*1.6+a*3),cz+Math.sin(ang)*R);break;
    case 3:{const f=(i/n+t*.04)%1,q=1-Math.abs(2*f-1);ang=q*TP*3+t*.5;r=R*(.25+.75*q);out.set(cx+Math.cos(ang)*r,.3+q*1.8,cz+Math.sin(ang)*r);break}
    case 4:r=R*(.3+.6*(.5+.5*Math.sin(t*1.1)));ang=a+t*.1;out.set(cx+Math.cos(ang)*r,1.15+.2*Math.sin(i*2+t),cz+Math.sin(ang)*r);break;
    case 5:u=t*.5+a;out.set(cx+R*1.2*Math.sin(u),1.1+.3*Math.sin(u*2+i),cz+R*1.2*Math.sin(u)*Math.cos(u));break;
  }
  return out;
}

/* ---------- audio ---------- */
let ac=null;
function ping(f,v=.07){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.type='sine';o.frequency.value=f;
  g.gain.setValueAtTime(v,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.6);
  o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.65);
}

/* ---------- cielo virtuale ---------- */
const skyMat=new THREE.ShaderMaterial({
  uniforms:{uA:{value:1}},side:THREE.BackSide,transparent:true,depthWrite:false,fog:false,
  vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform float uA;varying vec3 vP;void main(){vec3 d=normalize(vP);vec3 c=mix(vec3(.01,.01,.05),vec3(.08,.02,.15),d.y*.5+.5);vec3 g=floor(d*150.);float h=fract(sin(dot(g,vec3(12.9898,78.233,45.164)))*43758.5453);c+=step(.997,h)*vec3(.9,.95,1.);gl_FragColor=vec4(c,uA);}'
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(40,32,16),skyMat);
sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);

/* ---------- pavimento sui confini dell'utente ---------- */
const floorMat=new THREE.ShaderMaterial({
  uniforms:{uA:{value:1}},transparent:true,depthWrite:false,side:THREE.DoubleSide,
  vertexShader:'varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'uniform float uA;varying vec2 vP;void main(){vec2 q=vP*4.;vec2 g=abs(fract(q-.5)-.5)/fwidth(q);float l=1.-min(min(g.x,g.y),1.);gl_FragColor=vec4(vec3(.24,.65,1.),(l*.55+.06)*uA);}'
});
const lineMat=new THREE.LineBasicMaterial({color:0x7fe9ff,transparent:true});
const DEF=[[-2,-2],[2,-2],[2,2],[-2,2]];
let floorGroup=null,B=DEF,cx=0,cz=0,RI=2;
function segD(x,z,a,b){
  const dx=b[0]-a[0],dz=b[1]-a[1],l=dx*dx+dz*dz||1;
  const t=Math.max(0,Math.min(1,((x-a[0])*dx+(z-a[1])*dz)/l));
  return Math.hypot(x-a[0]-t*dx,z-a[1]-t*dz);
}
function inside(x,z){
  let c=false;
  for(let i=0,j=B.length-1;i<B.length;j=i++){
    const a=B[i],b=B[j];
    if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])c=!c;
  }
  return c;
}
function buildFloor(pts){
  if(floorGroup){scene.remove(floorGroup);floorGroup.traverse(o=>o.geometry&&o.geometry.dispose())}
  B=pts;cx=0;cz=0;
  pts.forEach(p=>{cx+=p[0]/pts.length;cz+=p[1]/pts.length});
  let m=1e9;
  for(let i=0;i<pts.length;i++)m=Math.min(m,segD(cx,cz,pts[i],pts[(i+1)%pts.length]));
  RI=Math.max(.8,m*.9);
  const mesh=new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(pts.map(p=>new THREE.Vector2(p[0],-p[1])))),floorMat);
  mesh.rotation.x=-Math.PI/2;
  const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(p[0],.01,p[1]))),lineMat);
  floorGroup=new THREE.Group();floorGroup.add(mesh,line);floorGroup.visible=floorOn;scene.add(floorGroup);
}
function applyBounds(rs,repopulate){
  const g=rs&&rs.boundsGeometry;
  buildFloor(g&&g.length>=3?[...g].map(p=>[p.x,p.z]):DEF);
  if(repopulate)populate();
}

/* ---------- riflessi dinamici (le sfere si specchiano sui materiali) ---------- */
const cubeRT=new THREE.WebGLCubeRenderTarget(128,{type:THREE.HalfFloatType});
const cubeCam=new THREE.CubeCamera(.05,60,cubeRT);scene.add(cubeCam);
let envFace=0,envOn=true;
function updateEnv(){
  if(!envOn)return;
  const a=skyMat.uniforms.uA.value,pv=panel.visible,xe=renderer.xr.enabled,rt=renderer.getRenderTarget();
  try{
    skyMat.uniforms.uA.value=1;panel.visible=false;hands.forEach(h=>h.visible=false);
    cubeCam.position.set(cx,1.1,cz);cubeCam.updateMatrixWorld(true);
    renderer.xr.enabled=false;
    renderer.setRenderTarget(cubeRT,envFace);
    renderer.render(scene,cubeCam.children[envFace]);
    envFace=(envFace+1)%6;
  }catch(e){envOn=false}
  renderer.setRenderTarget(rt);renderer.xr.enabled=xe;
  skyMat.uniforms.uA.value=a;panel.visible=pv;hands.forEach(h=>h.visible=true);
}

/* ---------- materiali ---------- */
function makeMat(i,hex){
  const c=new THREE.Color(hex),w=new THREE.Color(1,1,1),env=cubeRT.texture;
  switch(i){
    case 0:return new THREE.MeshStandardMaterial({color:c.clone().lerp(w,.35),roughness:1});
    case 1:return new THREE.MeshStandardMaterial({color:c,metalness:1,roughness:.06,envMap:env,envMapIntensity:1.4});
    case 2:return new THREE.MeshPhysicalMaterial({color:c.clone().lerp(w,.7),roughness:.02,transparent:true,opacity:.3,envMap:env,envMapIntensity:1.8,clearcoat:1});
    case 3:return new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:.25,roughness:.04,iridescence:1,iridescenceIOR:2.2,iridescenceThicknessRange:[250,1000],transparent:true,opacity:.8,envMap:env,envMapIntensity:2});
    case 4:return new THREE.MeshPhysicalMaterial({color:c,roughness:.3,clearcoat:1,clearcoatRoughness:.04,envMap:env,envMapIntensity:.8});
    default:return new THREE.MeshStandardMaterial({color:c,metalness:.5,roughness:.4});
  }
}

/* ---------- oggetti e sfere ---------- */
const gc=document.createElement('canvas');gc.width=gc.height=128;
{const x=gc.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
 g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.45)');g.addColorStop(1,'rgba(255,255,255,0)');
 x.fillStyle=g;x.fillRect(0,0,128,128);}
const glowTex=new THREE.CanvasTexture(gc);
const items=[];
const sphG=new THREE.SphereGeometry(.06,24,16);
const orbs=()=>items.filter(o=>o.userData.kind==='orb');

function addOrb(pos,hex){
  const c=new THREE.Color(hex),g=new THREE.Group();
  const core=new THREE.Mesh(sphG,new THREE.MeshBasicMaterial({color:c.clone().lerp(new THREE.Color(1,1,1),.5),toneMapped:false,fog:false}));
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:c,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,toneMapped:false,fog:false}));
  g.add(core,sp);g.position.copy(pos);
  g.userData={kind:'orb',r:.07,v:new THREE.Vector3(),ph:Math.random()*6.28,sp,core,c,cool:0,note:Math.floor(Math.random()*7),held:false};
  scene.add(g);items.push(g);return g;
}
function addSolid(kind,pos,hex,mi=matIdx){
  const geo={
    cube:()=>new THREE.BoxGeometry(.22,.22,.22),
    sphere:()=>new THREE.SphereGeometry(.14,32,20),
    column:()=>new THREE.CylinderGeometry(.07,.07,.8,32)
  }[kind]();
  geo.computeBoundingSphere();
  const m=new THREE.Mesh(geo,makeMat(mi,hex));
  m.position.copy(pos);m.userData={kind,r:geo.boundingSphere.radius,held:false,mat:mi,hex};
  scene.add(m);items.push(m);return m;
}
function populate(){
  items.splice(0).forEach(o=>scene.remove(o));
  for(let i=0;i<6;i++){const a=i/6*Math.PI*2;addOrb(new THREE.Vector3(cx+Math.cos(a)*RI*.6,1.1+.25*Math.sin(i*2),cz+Math.sin(a)*RI*.6),COL[i]);}
  [['cube',1,'#ff9f1c'],['sphere',3,'#ffffff'],['column',2,'#bfe6ff'],['cube',4,'#ff3d71']]
   .forEach(([k,m,h],i)=>{const a=(i+.5)/4*Math.PI*2;addSolid(k,new THREE.Vector3(cx+Math.cos(a)*RI*.8,FY[k],cz+Math.sin(a)*RI*.8),h,m)});
  $('n').value=6;$('nv').textContent=6;dirty=true;
}
function setOrbCount(n){
  n=Math.max(1,Math.min(24,n|0));let os=orbs();
  while(os.length<n){
    const a=Math.random()*6.28,r=Math.random()*RI*.7;
    addOrb(new THREE.Vector3(cx+Math.cos(a)*r,.9+Math.random()*.8,cz+Math.sin(a)*r),COL[colorIdx]);os=orbs();
  }
  while(os.length>n){const o=os.pop();scene.remove(o);items.splice(items.indexOf(o),1)}
  $('n').value=n;$('nv').textContent=n;dirty=true;
}

/* ---------- palette sulla mano sinistra ---------- */
const PS=.30;
const pcv=document.createElement('canvas');pcv.width=pcv.height=640;
const px=pcv.getContext('2d');
const ptex=new THREE.CanvasTexture(pcv);ptex.colorSpace=THREE.SRGBColorSpace;
const panel=new THREE.Mesh(new THREE.PlaneGeometry(PS,PS),new THREE.MeshBasicMaterial({map:ptex,transparent:true,toneMapped:false,fog:false}));
panel.visible=false;scene.add(panel);

const col3=[40,232,424];
const EL=[
  {id:'tab0',t:'m',x:40,y:26,w:176,h:56,l:'Ambiente'},
  {id:'tab1',t:'m',x:232,y:26,w:176,h:56,l:'Oggetti'},
  {id:'tab2',t:'m',x:424,y:26,w:176,h:56,l:'Luci'},
  {id:'vr',t:'s',tab:0,x:40,y:140,w:560,h:34,l:'Passthrough ⇄ VR'},
  {id:'gl',t:'s',tab:0,x:40,y:224,w:560,h:34,l:'Luminosità sfere'},
  {id:'fg',t:'s',tab:0,x:40,y:308,w:560,h:34,l:'Nebbia'},
  {id:'nm',t:'b',tab:0,x:300,y:392,w:90,h:60,l:'−'},
  {id:'np',t:'b',tab:0,x:490,y:392,w:90,h:60,l:'+'},
  ...COL.map((c,i)=>({id:'c'+i,t:'c',tab:0,i,x:40+i*96,y:520,w:80,h:56})),
  ...['sphere','cube','column','reset'].map((id,i)=>({id,t:'b',tab:1,x:col3[i%3],y:140+Math.floor(i/3)*76,w:176,h:64,l:['Sfera','Cubo','Colonna','Reset'][i]})),
  ...MATL.map((l,i)=>({id:'m'+i,t:'x',tab:1,i,l,x:col3[i%3],y:334+Math.floor(i/3)*76,w:176,h:64})),
  ...[['move','Sposta'],['mat','Materiale'],['del','Cancella']].map(([id,l],i)=>({id,t:'m',tab:1,x:col3[i],y:524,w:176,h:64,l})),
  ...PRESETS.map((q,i)=>({id:'pc'+i,t:'p',tab:2,i,l:q.n,x:col3[i%3],y:138+Math.floor(i/3)*58,w:176,h:50})),
  ...MOVES.map((l,i)=>({id:'mv'+i,t:'v',tab:2,i,l,x:col3[i%3],y:346+Math.floor(i/3)*58,w:176,h:50})),
  {id:'fl',t:'f',tab:2,x:40,y:534,w:560,h:62,l:''}
];
const vis=()=>EL.filter(e=>e.tab===undefined||e.tab===tab);

function drawPanel(){
  const x=px;x.clearRect(0,0,640,640);
  x.beginPath();x.roundRect(6,6,628,628,40);x.fillStyle='rgba(10,12,30,.93)';x.fill();
  x.lineWidth=5;x.strokeStyle='#4f5fe0';x.stroke();
  x.fillStyle='#9fb0ff';x.textAlign='left';x.font='600 22px system-ui,sans-serif';
  if(tab===0){
    x.font='600 26px system-ui,sans-serif';x.fillText('Punti luce',40,436);
    x.font='600 22px system-ui,sans-serif';x.fillText('Colore',40,506);
    x.fillStyle='#fff';x.textAlign='center';x.font='700 34px system-ui,sans-serif';x.fillText(orbs().length,440,436);
  }else if(tab===1){
    x.fillText('Forma',40,128);x.fillText('Materiale',40,322);x.fillText('Modo',40,512);
  }else{
    x.fillText('Colori luci',40,126);x.fillText('Movimento',40,334);
  }
  for(const e of vis()){
    const hv=e===hover;
    if(e.t==='s'){
      const v=e.id==='vr'?vr:e.id==='gl'?glow/2:fog;
      x.fillStyle='#9fb0ff';x.font='600 22px system-ui,sans-serif';
      x.textAlign='left';x.fillText(e.l,e.x,e.y-14);
      x.textAlign='right';x.fillText(Math.round(v*100)+'%',e.x+e.w,e.y-14);
      x.fillStyle='#1b2150';x.beginPath();x.roundRect(e.x,e.y+8,e.w,18,9);x.fill();
      const g=x.createLinearGradient(e.x,0,e.x+e.w,0);g.addColorStop(0,'#3da5ff');g.addColorStop(1,'#b06bff');
      x.fillStyle=g;x.beginPath();x.roundRect(e.x,e.y+8,Math.max(18,e.w*v),18,9);x.fill();
      x.fillStyle=hv?'#fff':'#dfe6ff';x.beginPath();x.arc(e.x+e.w*v,e.y+17,hv?20:16,0,7);x.fill();
    }else if(e.t==='c'){
      x.fillStyle=COL[e.i];x.beginPath();x.roundRect(e.x,e.y,e.w,e.h,14);x.fill();
      if(e.i===colorIdx||hv){x.lineWidth=5;x.strokeStyle='#fff';x.stroke();}
    }else if(e.t==='p'){
      const on=e.i===cpIdx;
      x.fillStyle=on?'#4f5fe0':(hv?'#2c3a8c':'#1d2552');
      x.beginPath();x.roundRect(e.x,e.y,e.w,e.h,16);x.fill();
      x.fillStyle='#fff';x.font='700 21px system-ui,sans-serif';x.textAlign='center';
      x.fillText(e.l,e.x+e.w/2,e.y+22);
      PRESETS[e.i].c.forEach((h,k)=>{x.fillStyle=h;x.beginPath();x.roundRect(e.x+12+k*27,e.y+31,23,11,5);x.fill()});
    }else{
      const on=(e.t==='x'&&e.i===matIdx)||(e.t==='v'&&e.i===mvIdx)||(e.t==='f'&&floorOn)||e.id===mode||e.id==='tab'+tab;
      x.fillStyle=on?(e.id==='del'?'#e0365f':'#4f5fe0'):(hv?'#2c3a8c':'#1d2552');
      x.beginPath();x.roundRect(e.x,e.y,e.w,e.h,18);x.fill();
      x.fillStyle='#fff';x.font='700 26px system-ui,sans-serif';x.textAlign='center';
      x.fillText(e.t==='f'?'Pavimento: '+(floorOn?'visibile':'nascosto'):e.l,e.x+e.w/2,e.y+e.h/2+9);
    }
  }
  ptex.needsUpdate=true;
}
function setSlider(e,f){
  f=Math.min(1,Math.max(0,f));
  if(e.id==='vr'){vr=f;$('vr').value=Math.round(f*100)}
  else if(e.id==='gl')glow=f*2;
  else{fog=f;$('fog').value=Math.round(f*100)}
}
function act(e,cp){
  ping(660,.05);
  const id=e.id;
  if(id==='tab0'||id==='tab1'||id==='tab2'){tab=+id[3];hover=null}
  else if(e.t==='c')colorIdx=e.i;
  else if(e.t==='x')matIdx=e.i;
  else if(e.t==='p')applyColorPreset(e.i);
  else if(e.t==='v')setMove(e.i);
  else if(id==='fl')toggleFloor();
  else if(id==='move'||id==='mat'||id==='del')mode=id;
  else if(id==='nm')setOrbCount(orbs().length-1);
  else if(id==='np')setOrbCount(orbs().length+1);
  else if(id==='reset')populate();
  else addSolid(id,panel.position.clone().add(new THREE.Vector3(0,.25,0)).lerp(cp,.12),COL[colorIdx]);
  dirty=true;
}
function pokeUpdate(tip,cp){
  let h=null,t=false,cX=0;
  if(tip&&open&&ps>.9){
    const p=panel.worldToLocal(tip.clone());
    cX=(p.x/PS+.5)*640;const cy=(.5-p.y/PS)*640;
    if(p.z<.07&&p.z>-.04){
      h=vis().find(e=>cX>=e.x-6&&cX<=e.x+e.w+6&&cy>=e.y-(e.t==='s'?14:6)&&cy<=e.y+e.h+(e.t==='s'?14:6))||null;
      t=p.z<.015;
    }
  }
  if(h!==hover){hover=h;dirty=true}
  if(h&&t){
    if(h.t==='s'){setSlider(h,(cX-h.x)/h.w);dirty=true}
    else if(!latch)act(h,cp);
  }
  latch=!!(h&&t);
}
$('vr').oninput=e=>{vr=e.target.value/100;dirty=true};
$('fog').oninput=e=>{fog=e.target.value/100;dirty=true};
$('n').oninput=e=>setOrbCount(+e.target.value);
function tint(o,hex){
  const u=o.userData;u.c.set(hex);u.sp.material.color.copy(u.c);
  u.core.material.color.copy(u.c).lerp(new THREE.Color(1,1,1),.5);
}
function applyColorPreset(i){
  cpIdx=i;PRESETS[i].c.forEach((h,k)=>{COL[k]=h});
  orbs().forEach((o,k)=>tint(o,COL[k%COL.length]));
  $('pcSel').value=i;dirty=true;
}
function setMove(i){
  mvIdx=i;orbs().forEach(o=>o.userData.v.set(0,0,0));
  $('mvSel').value=i;dirty=true;
}
function toggleFloor(){
  floorOn=!floorOn;if(floorGroup)floorGroup.visible=floorOn;
  $('floorBtn').textContent=floorOn?'Nascondi pavimento':'Mostra pavimento';dirty=true;
}
PRESETS.forEach((q,i)=>$('pcSel').add(new Option(q.n,i)));
MOVES.forEach((l,i)=>$('mvSel').add(new Option(l,i)));
$('pcSel').onchange=e=>applyColorPreset(+e.target.value);
$('mvSel').onchange=e=>setMove(+e.target.value);
$('floorBtn').onclick=toggleFloor;

/* ---------- mani ---------- */
const hands=[0,1].map(i=>{
  const h=renderer.xr.getHand(i);h.userData={};
  h.addEventListener('connected',e=>{h.userData.hd=e.data.handedness});
  h.addEventListener('disconnected',()=>{h.userData.hd=null});
  scene.add(h);return h;
});
const J=(h,n)=>{const j=h.joints&&h.joints[n];return j&&j.visible!==false?j.getWorldPosition(new THREE.Vector3()):null};

function grab(s,mid){
  let best=null,bd=.12;
  for(const o of items){const d=mid.distanceTo(o.position)-o.userData.r*.6;if(d<bd){bd=d;best=o}}
  if(!best)return;
  const u=best.userData;
  if(mode==='del'){scene.remove(best);items.splice(items.indexOf(best),1);ping(180,.14);dirty=true;return}
  if(mode==='mat'){
    if(u.kind==='orb'){u.c.set(COL[colorIdx]);u.sp.material.color.copy(u.c);u.core.material.color.copy(u.c).lerp(new THREE.Color(1,1,1),.5)}
    else{best.material=makeMat(matIdx,COL[colorIdx]);u.mat=matIdx;u.hex=COL[colorIdx]}
    ping(520,.05);return;
  }
  s.held=best;s.off=best.position.clone().sub(mid);s.last=best.position.clone();s.hv=new THREE.Vector3();
  u.held=true;if(u.v)u.v.set(0,0,0);
  ping(440,.04);
}
function release(s){
  const o=s.held;if(!o)return;
  o.userData.held=false;
  if(o.userData.v)o.userData.v.copy(s.hv).clampLength(0,3);
  s.held=null;
}
function toggle(){open=!open;snap=open;dirty=true;ping(open?523:392,.06)}

/* ---------- ciclo ---------- */
const clock=new THREE.Clock(),camPos=new THREE.Vector3(),camDir=new THREE.Vector3(),dummy=new THREE.Object3D();
let lastWrist=null;

buildFloor(DEF);populate();
{
  const go=$('go');go.disabled=true;go.textContent='Preparo la scena…';
  const tmp=MATL.map((_,i)=>{const m=new THREE.Mesh(sphG,makeMat(i,'#ffffff'));m.position.set(0,-30,0);scene.add(m);return m});
  const c=renderer.compileAsync?renderer.compileAsync(scene,camera):Promise.resolve(renderer.compile(scene,camera));
  Promise.race([c,new Promise(r=>setTimeout(r,8000))]).catch(()=>{}).then(()=>{
    tmp.forEach(m=>scene.remove(m));go.disabled=false;go.textContent='Entra in VR / passthrough';
  });
}

renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05)||.014,t=clock.elapsedTime;
  const pres=renderer.xr.isPresenting,ar=pres&&isAR;
  skyMat.uniforms.uA.value=ar?Math.min(1,vr+fog*.4):1;
  floorMat.uniforms.uA.value=ar?vr:1;
  lineMat.opacity=ar?vr:1;
  scene.fog.density=fog*.7;
  if(!pres){camera.position.set(cx+Math.sin(t*.1)*2.4,1.5,cz+Math.cos(t*.1)*2.4);camera.lookAt(cx,1.1,cz)}
  const xc=pres?renderer.xr.getCamera():camera;
  xc.getWorldPosition(camPos);xc.getWorldDirection(camDir);

  const fingers=[];let rightTip=null,leftWrist=null;
  for(const h of hands){
    const s=h.userData,hd=s.hd;if(!hd)continue;
    if(!s.dots&&h.joints['index-finger-tip']){
      ['index-finger-tip','thumb-tip'].forEach(n=>h.joints[n].add(new THREE.Mesh(new THREE.SphereGeometry(.007),new THREE.MeshBasicMaterial({color:0x7fe9ff,fog:false}))));
      s.dots=1;
    }
    const ti=J(h,'index-finger-tip'),tt=J(h,'thumb-tip'),tm=J(h,'middle-finger-tip'),wr=J(h,'wrist');
    if(!ti||!tt){if(s.held)release(s);s.pinch=false;s.prev=null;continue}
    const vel=s.prev?ti.clone().sub(s.prev).divideScalar(dt):new THREE.Vector3();
    s.prev=ti.clone();
    fingers.push({p:ti,vel,sp:vel.length()});
    if(hd==='right')rightTip=ti;
    if(hd==='left'&&wr)leftWrist=wr;
    const di=ti.distanceTo(tt),mid=ti.clone().add(tt).multiplyScalar(.5);
    if(!s.pinch&&di<.025){s.pinch=true;grab(s,mid)}
    else if(s.pinch&&di>.04){s.pinch=false;release(s)}
    if(s.held){
      s.held.position.copy(mid).add(s.off);
      s.hv.lerp(s.held.position.clone().sub(s.last).divideScalar(dt),.3);
      s.last.copy(s.held.position);
    }
    if(hd==='left'&&tm&&wr){
      const dm=tt.distanceTo(tm);
      if(!s.mp&&dm<.025&&di>.04){
        s.mp=true;const now=performance.now();
        if(now-(s.lastM||0)<500){
          s.lastM=0;
          const v=wr.clone().sub(camPos),d=v.length();
          if(d<.9&&v.normalize().dot(camDir)>.75)toggle();
        }else s.lastM=now;
      }else if(s.mp&&dm>.04)s.mp=false;
    }
  }

  /* palette: segue il polso sinistro, rivolta verso lo sguardo */
  if(leftWrist)lastWrist=leftWrist;
  if(lastWrist&&(open||ps>.01)){
    const toCam=camPos.clone().sub(lastWrist).normalize();
    const target=lastWrist.clone().add(new THREE.Vector3(0,.19,0)).addScaledVector(toCam,.04);
    if(snap){panel.position.copy(target);snap=false}
    else panel.position.lerp(target,1-Math.exp(-14*dt));
    dummy.position.copy(panel.position);dummy.lookAt(camPos);
    panel.quaternion.slerp(dummy.quaternion,1-Math.exp(-10*dt));
  }
  ps+=((open?1:0)-ps)*(1-Math.exp(-12*dt));
  panel.scale.setScalar(Math.max(ps,.001));
  panel.visible=ps>.02;
  panel.updateMatrixWorld(true);
  pokeUpdate(rightTip,camPos);
  if(dirty&&panel.visible){drawPanel();dirty=open&&!!hover}

  /* sfere */
  const os=orbs(),n=os.length,step=Math.max(1,Math.floor(n/NL));let li=0;
  os.forEach((o,idx)=>{
    const u=o.userData;u.cool-=dt;u.ph+=dt;
    if(!u.held){
      if(mvIdx===0||mvIdx===6){
        const am=mvIdx===6?10:1;
        u.v.x+=Math.sin(u.ph*.7+u.note)*.05*am*dt;
        u.v.y+=Math.cos(u.ph*.9+u.note)*.04*am*dt;
        u.v.z+=Math.sin(u.ph*.5+u.note*2)*.05*am*dt;
      }
      for(const f of fingers){
        if(f.sp>.5&&u.cool<=0&&o.position.distanceTo(f.p)<.1){
          u.v.copy(f.vel).multiplyScalar(.9).clampLength(0,4);
          ping(NOTES[u.note]);u.cool=.3;
        }
      }
      u.v.multiplyScalar(Math.exp(-(mvIdx===7?3:.9)*dt));
      o.position.addScaledVector(u.v,dt);
      if(mvIdx>=1&&mvIdx<=5)o.position.lerp(moveTarget(idx,n,t,TG),1-Math.exp(-3*dt));
      const p=o.position;p.y=Math.min(2.6,Math.max(.15,p.y));
      if(!inside(p.x,p.z)){p.x+=(cx-p.x)*.05;p.z+=(cz-p.z)*.05;u.v.multiplyScalar(.5)}
    }
    const pulse=1+.12*Math.sin(t*3+u.ph);
    u.sp.scale.setScalar(.4*pulse*(.5+glow*.5)*(1+fog*1.8));
    u.sp.material.opacity=Math.min(1,.2+.55*glow)*(1-.25*fog);
    if(idx%step===0&&li<NL){const l=lights[li++];l.position.copy(o.position);l.color.copy(u.c);l.intensity=glow*3}
  });
  for(;li<NL;li++)lights[li].intensity=0;

  updateEnv();
  renderer.render(scene,camera);
});

/* ---------- sessione ---------- */
renderer.xr.addEventListener('sessionstart',()=>{$('ui').style.display='none'});
renderer.xr.addEventListener('sessionend',()=>{$('ui').style.display='';open=false;ps=0;buildFloor(DEF);populate()});
$('go').onclick=async()=>{
  if(!navigator.xr){$('msg').textContent='WebXR non disponibile. Apri la pagina in HTTPS dal browser del visore (Meta Quest Browser).';return}
  try{
    ac=ac||new AudioContext();ac.resume();
    isAR=await navigator.xr.isSessionSupported('immersive-ar');
    if(!isAR&&!(await navigator.xr.isSessionSupported('immersive-vr'))){$('msg').textContent='Questo dispositivo non supporta sessioni immersive.';return}
    const s=await navigator.xr.requestSession(isAR?'immersive-ar':'immersive-vr',{requiredFeatures:['local-floor'],optionalFeatures:['hand-tracking','bounded-floor']});
    let rt='local-floor';
    try{const r=await s.requestReferenceSpace('bounded-floor');if(r.boundsGeometry&&r.boundsGeometry.length>=3)rt='bounded-floor'}catch(e){}
    renderer.xr.setReferenceSpaceType(rt);
    await renderer.xr.setSession(s);
    renderer.xr.setFoveation(1);
    const rs=renderer.xr.getReferenceSpace();
    applyBounds(rs,true);
    if(rs)rs.onreset=()=>applyBounds(renderer.xr.getReferenceSpace(),false);
    $('msg').textContent='';
  }catch(e){$('msg').textContent='Errore: '+e.message}
};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
